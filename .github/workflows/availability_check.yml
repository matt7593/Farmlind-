name: Availability Price Check

on:
  schedule:
    # Every day at 8pm ET (00:00 UTC)
    - cron: '0 0 * * *'
    # Thursday mornings ~6am-3:40pm ET (10:00-19:40 UTC), every 20 min — watch for
    # Dottavio's price-list email and send the updated spreadsheet once it arrives.
    - cron: '*/20 10-19 * * 4'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force send email even if no new messages today'
        required: false
        default: 'false'
      test_mode:
        description: 'Test mode — send only to babbe331@gmail.com'
        required: false
        default: 'false'

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic openpyxl pypdf

      - name: Run availability check
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN_1: ${{ secrets.GMAIL_REFRESH_TOKEN_1 }}
          GMAIL_REFRESH_TOKEN_2: ${{ secrets.GMAIL_REFRESH_TOKEN_2 }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          RUN_MODE: ${{ github.event.schedule == '*/20 10-19 * * 4' && 'dottavio_watch' || 'daily' }}
        run: python scripts/availability_check.py

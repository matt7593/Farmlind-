name: Availability Price Check

on:
  schedule:
    # Every day at 8pm ET (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force send email even if no new messages today'
        required: false
        default: 'false'

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic openpyxl

      - name: Run availability check
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN_1: ${{ secrets.GMAIL_REFRESH_TOKEN_1 }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: python scripts/availability_check.py

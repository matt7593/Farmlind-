name: Matt Order Check

on:
  schedule:
    # Reliable infrequent triggers (GitHub honors these far better than */5).
    # The job itself loops every 3 min during the evening window (see run step).
    - cron: '0 23 * * *'    # 7pm ET — start the tight evening loop
    - cron: '0 */3 * * *'   # every 3 hours — safety net for off-window orders
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force send the reminder email even if already sent or outside delay window'
        required: false
        default: 'false'
      dry_run:
        description: 'Print the email preview without actually sending it'
        required: false
        default: 'false'

# If a new trigger fires while a loop is already running, replace it cleanly.
concurrency:
  group: order-check
  cancel-in-progress: true

jobs:
  check-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic openpyxl python-docx

      - name: Run order check
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_REFRESH_TOKEN_1: ${{ secrets.GMAIL_REFRESH_TOKEN_1 }}
          GMAIL_REFRESH_TOKEN_2: ${{ secrets.GMAIL_REFRESH_TOKEN_2 }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set +e
          # If manually triggered with force_send, just run once immediately.
          if [ "$FORCE_SEND" = "true" ] || [ "$DRY_RUN" = "true" ]; then
            echo "Manual trigger: single check with FORCE_SEND=$FORCE_SEND DRY_RUN=$DRY_RUN"
            python scripts/check_orders.py
            exit 0
          fi
          hour=$(date -u +%H)
          # Evening window in UTC = 23:00-05:59 (7pm-2am ET).
          # During the window, loop every 3 minutes until 2:10am ET (06:10 UTC).
          # Outside the window, do a single quick check (safety net).
          case "$hour" in
            23|00|01|02|03|04|05)
              if [ "$hour" = "23" ]; then
                end=$(date -u -d 'tomorrow 06:10' +%s)
              else
                end=$(date -u -d 'today 06:10' +%s)
              fi
              echo "Evening window: looping every 3 min until 06:10 UTC (2am ET)."
              while [ "$(date -u +%s)" -lt "$end" ]; do
                python scripts/check_orders.py
                [ "$(date -u +%s)" -lt "$end" ] && sleep 180
              done
              ;;
            *)
              echo "Off-window run: single check."
              python scripts/check_orders.py
              ;;
          esac

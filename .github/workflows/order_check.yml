name: Matt Order Check

on:
  schedule:
    - cron: '0 23 * * *'    # 7pm EST — start the evening loop
    - cron: '0 */3 * * *'   # every 3 hours — safety net
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force send reminder'
        required: false
        default: 'false'
      dry_run:
        description: 'Preview without sending'
        required: false
        default: 'false'
      test_email:
        description: 'Send to this address'
        required: false
        default: ''

concurrency:
  group: order-check
  cancel-in-progress: true

jobs:
  check-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic
      - name: Run order check
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_REFRESH_TOKEN_1: ${{ secrets.GMAIL_REFRESH_TOKEN_1 }}
          GMAIL_REFRESH_TOKEN_2: ${{ secrets.GMAIL_REFRESH_TOKEN_2 }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: |
          set +e
          
          if [ "$FORCE_SEND" = "true" ] || [ "$DRY_RUN" = "true" ]; then
            echo "Manual trigger"
            python scripts/check_orders.py
            exit 0
          fi

          hour=$(date -u +%H)

          # Evening window: 23:00-06:10 UTC (7pm-2:10am EST)
          case "$hour" in
            23|00|01|02|03|04|05)
              # Set end time for loop
              if [ "$hour" = "23" ]; then
                end_time=$(date -u -d 'tomorrow 06:10' +%s)
              else
                end_time=$(date -u -d 'today 06:10' +%s)
              fi

              echo "Evening window (7pm-2:10am EST): monitoring..."
              
              # Loop every 3 minutes until 2:10am
              while true; do
                current_time=$(date -u +%s)

                # Check if past end time
                if [ "$current_time" -ge "$end_time" ]; then
                  echo "Reached 2:10am EST - final check"
                  python scripts/check_orders.py
                  exit 0
                fi

                # Scan mode - script will decide when to send based on 30-min timer
                export SCAN_ONLY=true
                echo "[$(date +'%Y-%m-%d %H:%M:%S')] Checking..."
                python scripts/check_orders.py
                
                sleep 180
              done
              ;;
            *)
              echo "Outside evening window: single check"
              python scripts/check_orders.py
              ;;
          esac
